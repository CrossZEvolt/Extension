<!doctype html><meta charset="utf-8"><title>CrossZ Privacy</title><h1>Quyền riêng tư</h1><p>Cài đặt và lỗi được lưu trong trình duyệt. Không gửi âm thanh hoặc lịch sử xem đến máy chủ của CrossZ. Đồng bộ cài đặt theo tài khoản trình duyệt chỉ xảy ra khi bạn chọn xuất lên cloud. YouTube có thể được yêu cầu storyboard để tối ưu hiệu ứng.</p>
